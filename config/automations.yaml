- action:
  - action: eud4xr.sweeps
    data:
      entity_id: sensor.scopa_ecabroom
      surface: sensor.tavolo_ecasurface
  - alias: sequence.pulizia piano lavoro
    service: automation.turn_on
    data:
      entity_id: automation.lo_spruzzino_si_sposta_nella_posizione_0_su_tutti_gli_assi
  - alias: sequence.pulizia piano lavoro
    service: automation.turn_off
    data:
      entity_id: automation.la_scopa_pulisce_il_tavolo_quando_lo_spruzzino_si_attiva
  alias: la_scopa_pulisce_il_tavolo_quando_lo_spruzzino_si_attiva
  condition: []
  description: Questa automazione attiva la scopa per pulire il tavolo quando lo spruzzino
    viene attivato.
  id: 89001d3c-38a4-41b6-b308-752970765c6c
  trigger:
  - event_data:
      subject: spruzzino
      verb: activates
    event_type: eud4xr
    platform: event
- action:
  - action: eud4xr.moves_to
    data:
      entity_id: sensor.spruzzino_ecaobject
      newPos:
        x: 0
        y: 0
        z: 0
  - alias: sequence.pulizia piano lavoro
    service: automation.turn_off
    data:
      entity_id: automation.lo_spruzzino_si_sposta_nella_posizione_0_su_tutti_gli_assi
  alias: lo_spruzzino_si_sposta_nella_posizione_0_su_tutti_gli_assi
  condition: []
  description: Questa automazione sposta lo spruzzino nella posizione (0, 0, 0) su
    tutti gli assi quando la scopa viene nascosta.
  id: d34daf0c-9ad3-4809-9bb7-716a15bfb08e
  trigger:
  - event_data:
      obj:
        x: 1
        y: 1
        z: 1
      subject: spruzzino
      verb: moves to
    event_type: eud4xr
    platform: event

    automaticamente. Questa automazione collega l'azione di spruzzare acqua con il
    cambiamento di stato dello straccio, che passa da asciutto a bagnato senza bisogno
    di ulteriori interventi.
  id: cb2f4c5a-61e7-4c43-956c-a8452d1e72df

      value_template: '{{ state_attr("sensor.straccio_ecasoakablecleaningitem", "hasWater")
        == "yes" }}'
    - condition: template
      value_template: '{{ state_attr("sensor.straccio_ecasoakablecleaningitem", "hasDegreaser")
        == "yes" }}'
  description: "Quando passi lo straccio sul tavolo, solo se lo straccio \xE8 bagnato\
    \ e contiene sgrassatore, le macchie sul tavolo vengono rimosse automaticamente.\
    \ Questa automazione assicura che la pulizia delle macchie avvenga solo quando\
    \ lo straccio \xE8 nelle condizioni giuste per sgrassare."
